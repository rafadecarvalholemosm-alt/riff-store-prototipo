# Publicação estática da pasta public/ quando o GitHub Pages estiver habilitado.
# O job não executa o servidor Express nem disponibiliza um serviço MySQL.
# Publica a pasta public/ no GitHub Pages a cada push na main.
# Para ativar: Settings → Pages → Source: "GitHub Actions".
name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Baixar os arquivos do projeto
        uses: actions/checkout@v7
      - name: Configurar a publicação no Pages
        uses: actions/configure-pages@v6
      - name: Preparar os arquivos do site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@v5
